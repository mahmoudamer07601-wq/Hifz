<script>
(function(){
var r=document.documentElement,s=1,hooks=[],K='hifz-ui';
function lang(){var u=r.getAttribute('data-ui');return u==='en'||u==='es'?u:'ar';}
function attrs(root){var l=lang(),n=['title','aria-label','placeholder','alt'],els=(root||document).querySelectorAll('[data-i18n-attr]'),i,j,v;
 for(i=0;i<els.length;i++)for(j=0;j<n.length;j++){v=els[i].getAttribute('data-'+n[j]+'-'+l);if(v!==null)els[i].setAttribute(n[j],v);}}
function title(){var t=document.getElementsByTagName('title')[0],v=t&&t.getAttribute('data-'+lang());if(v)document.title=v;}
function mark(){var b=document.querySelectorAll('.tools [data-ui-set]'),l=lang();
 for(var i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',b[i].getAttribute('data-ui-set')===l?'true':'false');}
function set(l){if(l!=='en'&&l!=='es')l='ar';r.setAttribute('data-ui',l);try{localStorage.setItem(K,l);}catch(e){}
 mark();attrs();title();for(var i=0;i<hooks.length;i++){try{hooks[i](l);}catch(e){}}}
window.hifzUI={lang:lang,set:set,attrs:attrs,on:function(f){hooks.push(f);}};
document.querySelectorAll('.tools [data-font]').forEach(function(b){b.addEventListener('click',function(){
  r.style.setProperty('--qfont','"'+b.dataset.font+'"');
  document.querySelectorAll('.tools [data-font]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
});});
document.querySelectorAll('.tools [data-scale]').forEach(function(b){b.addEventListener('click',function(){
  s=Math.min(1.6,Math.max(0.7,s+(b.dataset.scale==='+'?0.1:-0.1)));r.style.setProperty('--qscale',s.toFixed(2));
});});
document.querySelectorAll('.tools [data-ui-set]').forEach(function(b){b.addEventListener('click',function(){set(b.getAttribute('data-ui-set'));});});
/* --tools-h: the toolbar's height (it wraps differently per language and width), so a jump to a
